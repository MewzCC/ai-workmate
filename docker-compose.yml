# 一键部署 AI WorkMate：基础设施 + 后端 + 两个前端
# 用法：
#   1. 复制 .env.docker.example 为 .env.docker，填入生产密钥
#      cp .env.docker.example .env.docker
#   2. docker compose --env-file .env.docker up -d --build
#   3. 访问 http://<host>:3000（主站）、http://<host>:3001/oa/（OA 分端口形态）
#      或同端口反代形态：外部 nginx 用 location /oa/ 转发到 fonted-oa 容器，
#      主站"立即尝试"按钮跳 /oa/（在 .env.docker 设 VITE_OA_URL=/oa/）
# 端口约定（与 AGENTS.md 一致）：主站 3000、OA 3001、后端 8080、基础设施按需暴露
# 注意：必须用 --env-file .env.docker 启动。docker compose 的变量插值默认只读
#       同目录 .env，不读 .env.docker；不加该参数时 .env.docker 里的 VITE_OA_URL
#       等构建期变量无法注入 fronted-main 镜像（backend 运行时变量靠 env_file 不受影响）。
#       本地开发时请从 .env.example 重新复制，不要复用 .env.docker。

services:
  # ========== 基础设施 ==========
  # PostgreSQL + pgvector
  # schema 由后端 Flyway 在启动时自动迁移（db/migration 下的版本化脚本），
  # 不再挂载 init.sql 到 docker-entrypoint-initdb.d，避免与 Flyway 重复执行冲突。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiworkmate-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_workmate_dev}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis
  redis:
    image: redis:7-alpine
    container_name: aiworkmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # MinIO 对象存储（附件 / 头像 / 壁纸）
  minio:
    image: minio/minio:latest
    container_name: aiworkmate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ========== OCR 识别服务（PaddleOCR + PyMuPDF，图片/PDF） ==========
  # 仅后端内网调用，不映射公网端口；首次启动需下载模型并完成初始化
  # OCR 为可选能力：docker compose --profile ocr up -d --build
  ocr-service:
    profiles: ["ocr"]
    build:
      context: ./docker/ocr-service
    container_name: aiworkmate-ocr
    environment:
      OCR_SERVICE_API_KEY: ${OCR_API_KEY:-}
      OCR_USE_GPU: ${OCR_USE_GPU:-0}
      OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.6}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
    volumes:
      - ocr_model_data:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8686/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  # ========== 后端 ==========
  backend:
    build:
      context: ./backend
    container_name: aiworkmate-backend
    # 从根目录 .env.docker 读取配置注入容器运行时环境（env_file 仅影响容器启动环境，
    # 不参与 build args 变量插值；fronted-main 的构建期变量需靠顶部 --env-file .env.docker 注入）
    env_file:
      - .env.docker
    environment:
      # 容器内通过服务名连接基础设施（覆盖 application.yml 的 localhost 默认值）
      # TZ 必须设为东八区：后端用 LocalDateTime.now() 记录打卡/业务时间，
      # 容器默认 UTC 会导致记录时间比北京时间慢 8 小时（打卡显示 07:55 而非 15:55）
      TZ: Asia/Shanghai
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_workmate_dev}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_BASE_URL: http://ocr-service:8686
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # ========== 前端：营销官网 ==========
  # nginx 托管 dist，/api 反代到 backend:8080
  # VITE_OA_URL 留空时代码自动跳到 http://<host>:3001/oa/（主站 3000 / OA 3001 分离）
  fronted-main:
    build:
      context: ./fronted-main
      args:
        # 留空：主站 3000 / OA 3001 分离部署，代码按 hostname 自动拼 3001
        # 同端口反代场景：设为 /oa/（外部 nginx 用 location /oa/ 转发到 fonted-oa 容器）
        # 独立域名部署：设为完整 URL，如 https://oa.example.com/oa/
        # 此变量来自 .env.docker，必须用 docker compose --env-file .env.docker 启动才会注入
        VITE_OA_URL: ${VITE_OA_URL:-}
    container_name: aiworkmate-main
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # ========== 前端：OA 工作台 ==========
  # nginx 托管 /oa/ 静态产物，/api 反代到 backend:8080
  fonted-oa:
    build:
      context: ./fonted-oa
    container_name: aiworkmate-oa
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ocr_model_data:
