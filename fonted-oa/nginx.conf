# fonted-oa nginx 配置
# 托管 OA 静态产物（/oa/），反代 /api 到后端容器
# vite base=/oa/：产物 index.html 引用 /oa/assets/...，实际文件位于 /usr/share/nginx/html/assets/...
# 因此 /oa/ 用 alias 映射到静态根目录

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # /api 反代到后端（容器名 backend，端口 8080）
    # SSE 流式响应：关闭 buffer，启用 proxy_buffering off 保证实时推送
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 文件上传体积（壁纸上传等）
        client_max_body_size 25m;
    }

    # /oa/ 静态资源（vite 产物带 /oa/ 前缀，实际文件在 html 根目录下）
    # /oa/assets/xxx → /usr/share/nginx/html/assets/xxx
    location /oa/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /oa/ 入口与 SPA history 路由回退
    # /oa/ → index.html；/oa/anything → index.html（前端路由处理）
    location /oa/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /oa/index.html;
    }

    # 根路径重定向到 /oa/（直接访问根时进入 OA）
    location = / {
        return 302 /oa/;
    }
}
