name: Phase 1 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENT_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      AGENT_TEST_DB_USERNAME: postgres
      AGENT_TEST_DB_PASSWORD: postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_workmate_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify idempotent database initialization
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ai_workmate_dev -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/init.sql
          psql -h localhost -U postgres -d ai_workmate_dev -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/init.sql
      - name: Install isolated test Redis binary
        run: |
          if ! command -v redis-server > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          echo "AGENT_TEST_REDIS_BINARY=$(command -v redis-server)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Restore isolated test MinIO binary
        id: test-minio-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/minio
          key: minio-linux-amd64-go1.24.6-07c3a429bfed433e49018cb0f78a52145d4bedeb
      - name: Build isolated test MinIO from pinned source
        if: steps.test-minio-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/minio-source"
          git -C "$RUNNER_TEMP/minio-source" remote add origin https://github.com/minio/minio.git
          git -C "$RUNNER_TEMP/minio-source" fetch --depth=1 origin 07c3a429bfed433e49018cb0f78a52145d4bedeb
          git -C "$RUNNER_TEMP/minio-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/minio-source" rev-parse HEAD)" = 07c3a429bfed433e49018cb0f78a52145d4bedeb
          cd "$RUNNER_TEMP/minio-source"
          go build -p 2 -trimpath -o "$RUNNER_TEMP/minio" .
      - name: Backend tests
        env:
          AGENT_TEST_MINIO_BINARY: ${{ runner.temp }}/minio
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test
      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/*.txt
          retention-days: 7

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend-main/package-lock.json
            frontend-oa/package-lock.json
      - name: Marketing site checks
        working-directory: frontend-main
        run: |
          npm ci
          npm run lint
          npm run build
      - name: OA tests and build
        working-directory: frontend-oa
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
