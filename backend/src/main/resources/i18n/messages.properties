# ============================================================
# AI WorkMate 默认消息资源（zh-CN，与 messages_zh_CN.properties 同义）
# 所有 ErrorCode、BusinessException、@Valid 校验消息必须通过 key 引用，
# 禁止在 Java 代码中硬编码中文文案。
# ============================================================

# ---------- ErrorCode 默认消息 ----------
error.REQUEST_INVALID=请求参数不合法
error.AUTH_REQUIRED=请先登录
