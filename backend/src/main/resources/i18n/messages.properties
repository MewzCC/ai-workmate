error.AUTH_CAPTCHA_REQUIRED=请先完成图形验证码
error.AUTH_ACCOUNT_LOCKED=登录尝试过多，账号已临时锁定
error.PERMISSION_DENIED=权限不足
error.RESOURCE_FORBIDDEN=无权访问该资源
error.RESOURCE_NOT_FOUND=资源不存在
error.APPROVER_NOT_CONFIGURED=未配置有效审批人
error.BUSINESS_STATE_INVALID=当前状态不允许执行该操作
error.VERSION_CONFLICT=数据已被其他操作更新，请刷新后重试
error.AI_TASK_CONFIRMATION_REQUIRED=任务执行前必须确认
error.AI_TASK_CAPABILITY_UNAVAILABLE=AI 任务能力尚未接入真实业务工具，当前不可用
error.AI_CHAT_UNAVAILABLE=AI 对话服务暂时不可用
error.EMBEDDING_UNAVAILABLE=向量模型服务暂时不可用
error.EMBEDDING_RESPONSE_INVALID=向量模型返回了无效结果
error.TOOL_CAPABILITY_UNAVAILABLE=业务工具当前不可用
error.RATE_LIMITED=请求过于频繁，请稍后重试
error.AUTH_SERVICE_UNAVAILABLE=认证服务暂时不可用
error.SYSTEM_ERROR=系统内部错误

