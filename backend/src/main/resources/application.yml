spring:
  application:
    name: ai-workmate
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ========== 数据库 ==========
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_workmate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # ========== 数据库迁移 Flyway ==========
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既有数据库（由 init.sql 初始化过、无 schema history）启动时自动基线，再执行剩余迁移
    baseline-on-migrate: true
    baseline-version: 0

  # ========== Redis ==========
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ========== Mail ==========
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}

  # ========== MyBatis-Plus ==========
  mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: com.aiworkmate.entity
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

  # ========== AI 配置 ==========
  ai:
    openai:
      api-key: ${AI_API_KEY:development-only-unconfigured}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        enabled: true
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 4096

  # ========== 文件上传 ==========
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

app:
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:oa_session}
    session-ttl: ${AUTH_SESSION_TTL:86400}
    email-code-ttl: ${EMAIL_CODE_TTL:300}
    email-code-cooldown: ${EMAIL_CODE_COOLDOWN:60}
    email-code-hourly-limit: ${EMAIL_CODE_HOURLY_LIMIT:5}
    email-code-daily-limit: ${EMAIL_CODE_DAILY_LIMIT:10}
    email-code-max-attempts: ${EMAIL_CODE_MAX_ATTEMPTS:5}
    captcha-ttl: ${CAPTCHA_TTL:180}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-seconds: ${LOGIN_LOCK_SECONDS:900}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    mail-from-name: ${SMTP_FROM_NAME:AI WorkMate}
    mail-from-email: ${SMTP_FROM_EMAIL:}
  upload:
    storage-prefix: ${AI_UPLOAD_PREFIX:chat-attachments/}
    image-max-bytes: 10485760
    file-max-bytes: 20971520
    extracted-text-max-chars: 120000
    attachment-max-age-days: ${ATTACHMENT_MAX_AGE_DAYS:30}
    attachment-cleanup-cron: ${ATTACHMENT_CLEANUP_CRON:0 30 3 * * *}
  profile:
    avatar-storage-prefix: ${USER_AVATAR_PREFIX:user-avatars/}
    avatar-max-bytes: 2097152
    wallpaper-storage-prefix: ${USER_WALLPAPER_PREFIX:user-wallpapers/}
    wallpaper-max-bytes: 5242880
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:ai-workmate}
    region: ${MINIO_REGION:}
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  workflow:
    approval-due-hours: ${APPROVAL_DUE_HOURS:48}
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    provider: ${EMBEDDING_PROVIDER:local}
    local-base-url: ${EMBEDDING_LOCAL_BASE_URL:http://127.0.0.1:18080}
    local-model: ${EMBEDDING_LOCAL_MODEL:Qwen3-Embedding-0.6B}
    api-base-url: ${EMBEDDING_API_BASE_URL:https://api.openai.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    api-model: ${EMBEDDING_API_MODEL:text-embedding-3-small}
    api-send-dimensions: ${EMBEDDING_API_SEND_DIMENSIONS:true}
    dimension: ${EMBEDDING_DIMENSION:1024}
    batch-size: ${EMBEDDING_BATCH_SIZE:16}
    connect-timeout-ms: ${EMBEDDING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${EMBEDDING_READ_TIMEOUT_MS:60000}
    chunk-max-chars: ${KNOWLEDGE_CHUNK_MAX_CHARS:1000}
    chunk-overlap-chars: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:120}
    max-document-chars: ${KNOWLEDGE_MAX_DOCUMENT_CHARS:120000}
    retrieval-top-k: ${KNOWLEDGE_RETRIEVAL_TOP_K:5}
    retrieval-min-score: ${KNOWLEDGE_RETRIEVAL_MIN_SCORE:0.35}
    sparse-min-score: ${KNOWLEDGE_SPARSE_MIN_SCORE:0.05}
    rerank:
      enabled: ${RERANK_ENABLED:false}
      model: ${RERANK_MODEL:Qwen/Qwen3-Reranker-4B}
      api-base-url: ${RERANK_API_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${RERANK_API_KEY:}
      connect-timeout-ms: ${RERANK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${RERANK_READ_TIMEOUT_MS:30000}
      top-n: ${RERANK_TOP_N:5}
  ocr:
    enabled: ${OCR_ENABLED:true}
    base-url: ${OCR_BASE_URL:http://127.0.0.1:8686}
    api-key: ${OCR_API_KEY:}
    timeout-ms: ${OCR_TIMEOUT_MS:30000}
    min-confidence: ${OCR_MIN_CONFIDENCE:0.6}

# ========== JWT 配置 ==========
jwt:
  secret: ${JWT_SECRET:YWktd29ya21hdGUtand0LXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9u}

# ========== 服务端口 ==========
server:
  port: 8080

# ========== 日志 ==========
logging:
  level:
    com.aiworkmate: debug
    com.aiworkmate.agent: info
    org.springframework.ai: info

# ========== Phase 2 Agent（默认全部关闭，发布时显式开启） ==========
agent:
  enabled: ${AGENT_ENABLED:false}
  planning-enabled: ${AGENT_PLANNING_ENABLED:false}
  execution-enabled: ${AGENT_EXECUTION_ENABLED:false}
  write-tools-enabled: ${AGENT_WRITE_TOOLS_ENABLED:false}
  retention-cleanup-enabled: ${AGENT_RETENTION_CLEANUP_ENABLED:true}
  retention-batch-size: ${AGENT_RETENTION_BATCH_SIZE:500}
  retention-cleanup-cron: ${AGENT_RETENTION_CLEANUP_CRON:0 15 4 * * *}
  limits:
    input-max-bytes: 4096
    page-context-max-bytes: 16384
    page-context-max-depth: 3
    max-plan-steps: 3
    max-tool-calls: 5
    max-concurrent-tasks-per-user: 2
    default-query-size: 20
    max-query-size: 50
    default-knowledge-top-k: 5
    max-knowledge-top-k: 10
    max-step-result-bytes: 262144
    default-tool-timeout-ms: 15000
    max-tool-timeout-ms: 30000
    default-task-timeout-ms: 60000
    max-task-timeout-ms: 120000
    confirmation-token-ttl-seconds: 600
    task-retention-days: 90
    event-retention-days: 30
